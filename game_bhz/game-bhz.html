                }

                // 🆕 在控制台显示完整的增强提示
                console.log('📤 [原始选项]', optionText);
                console.log('📤 [完整选项(含操作)]', finalOption);
                console.log('🤖 [发送给AI的完整Prompt]', enhancedOption);

                // 🔧 传入原始选项文本（用于向量检索）
                const response = await callAI(enhancedOption, false, finalOption);

                // 移除加载提示
                const loading = document.getElementById('loading-message');
                if (loading) loading.remove();

                handleAIResponse(response);

                // 触发动态世界生成（异步，不阻塞主流程）
                generateDynamicWorld().catch(err => console.error('[动态世界] 生成异常:', err));

            } catch (error) {
                // 移除加载提示
                const loading = document.getElementById('loading-message');
                if (loading) loading.remove();

                // ❌ 不要移除用户消息！显示错误和重试按钮
                displayErrorMessageWithRetry('AI响应失败：' + error.message, async () => {
                    // 移除错误消息
                    const errorDiv = document.getElementById('error-message-with-retry');
                    if (errorDiv) errorDiv.remove();
                    
                    // 重新生成最后的响应
                    await regenerateLastResponse();
                });
            }

            gameState.isProcessing = false;
        }

        // Make selectOption globally accessible
        window.selectOption = selectOption;


        // ==================== 格式化游戏 ====================
        // formatGame 在 game-core-systems.js 有简化版本
        // 但这里保留完整版本，包含游戏状态重置逻辑
        async function formatGame() {
            if (!confirm('⚠️ 警告：格式化将清除所有存档和进度，包括DLC知识包，此操作不可恢复！\n\n✅ 将保留：\n- API配置\n- 游戏设置\n- 动态世界设置\n\n确定要格式化吗？')) {
                return;
            }

            console.log('[格式化] 开始格式化，将保留 API 配置、游戏设置和动态世界设置');
            
            // 重置状态
            gameState.variables = {
                name: "",
                gender: "",
                realm: "",
                identity: "",
                karmaFortune: 0,
                karmaPunishment: 0,
                cultivationProgress: 0,
                cultivationProgressMax: 100,
                hp: 100,
                hpMax: 100,
                mp: 100,
                mpMax: 100,
                talents: [],
                attributes: {
                    physique: 0,
                    fortune: 0,
                    comprehension: 0,
                    spirit: 0,
                    potential: 0,
                    charisma: 0
                },
                equipment: {
                    head: null,
                    clothes: null,
                    feet: null,
                    treasure1: null,
                    treasure2: null,
                    treasure3: null
                },
                items: [],
                techniques: [],
                spells: [],
                relationships: [],
                location: "",
                history: []
            };
            gameState.previousVariables = null;
            gameState.conversationHistory = [];
            gameState.variableSnapshots = [];
            gameState.isGameStarted = false;
            gameState.isProcessing = false;
            gameState.characterInfo = null;

            // 清除 IndexedDB 中的所有数据（包括所有存档）
            try {
                await clearGameHistory();
            } catch (error) {
                console.error('清除数据失败:', error);
            }
            
            // 【新增】清空向量库
            if (window.contextVectorManager) {
                window.contextVectorManager.clear();
                window.contextVectorManager.saveToIndexedDB().catch(err => {
                    console.error('清空向量库失败:', err);
                });
                
                // 清空静态知识库
                window.contextVectorManager.clearStaticKB();
                window.contextVectorManager.saveStaticKBToIndexedDB().catch(err => {
                    console.error('清空静态知识库失败:', err);
                });
            }

            // 清空DLC数据
            if (window.dlcManager) {
                try {
                    await window.dlcManager.clearAllDLCs();
                    console.log('[格式化] 已清空所有DLC数据');
                } catch (error) {
                    console.error('[格式化] 清空DLC数据失败:', error);
                }
            }

            // 重置动态世界数据（保留 enabled 和 messageInterval 设置）
            gameState.dynamicWorld = {
                enabled: gameState.dynamicWorld?.enabled || false,
                history: [],
                floor: 0,
                isProcessing: false,
                messageInterval: gameState.dynamicWorld?.messageInterval || 1, // 保留间隔设置
                messageCounter: 0 // 重置计数器
            };
            console.log('[格式化] 已重置动态世界数据（已保留 enabled 和 messageInterval 设置）');
            
            // 更新动态世界Tab显示
            displayDynamicWorldHistory();

            // 更新状态面板
            updateStatusPanel();

            // 显示主菜单
            showMainMenu();
        }

        // 切换人际关系详情展开/折叠
        function toggleRelationshipDetails(index) {
            const detailsDiv = document.getElementById(`relationship-details-${index}`);
            const cardDiv = detailsDiv.parentElement;
            
            if (detailsDiv.classList.contains('show')) {
                // 折叠
                detailsDiv.classList.remove('show');
                cardDiv.classList.remove('expanded');
            } else {
                // 展开
                detailsDiv.classList.add('show');
                cardDiv.classList.add('expanded');
            }
        }

       
    </script>
