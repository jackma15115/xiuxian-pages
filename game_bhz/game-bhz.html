    <!-- 白虎宗专用数据隔离脚本 - 必须在其他脚本之前加载 -->
    <script>
        // 为白虎宗游戏创建独立的数据命名空间
        (function() {
            const BHZ_PREFIX = 'bhz_';
            const BHZ_DB_NAME = 'bhz_xiuxian_dlc_db';
            const BHZ_VECTOR_DB_NAME = 'bhz_VectorDB';
            
            // 包装localStorage，自动添加bhz_前缀
            const originalLocalStorage = {
                getItem: localStorage.getItem.bind(localStorage),
                setItem: localStorage.setItem.bind(localStorage),
                removeItem: localStorage.removeItem.bind(localStorage),
                clear: localStorage.clear.bind(localStorage)
            };
            
            // 重写localStorage方法
            Storage.prototype.getItem = function(key) {
                return originalLocalStorage.getItem(BHZ_PREFIX + key);
            };
            
            Storage.prototype.setItem = function(key, value) {
                return originalLocalStorage.setItem(BHZ_PREFIX + key, value);
            };
            
            Storage.prototype.removeItem = function(key) {
                return originalLocalStorage.removeItem(BHZ_PREFIX + key);
            };
            
            // clear方法只清除bhz_前缀的数据
            Storage.prototype.clear = function() {
                const keysToRemove = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith(BHZ_PREFIX)) {
                        keysToRemove.push(key);
                    }
                }
                keysToRemove.forEach(key => originalLocalStorage.removeItem(key));
            };
            
            // 保存配置供DLCManager使用
            window.BHZ_CONFIG = {
                DB_NAME: BHZ_DB_NAME,
                VECTOR_DB_NAME: BHZ_VECTOR_DB_NAME,
                DLC_FILE: '白虎宗巨瑟修仙（拜师版）.json'
            };
            
            console.log('[白虎宗] 数据隔离已启用 - localStorage前缀:', BHZ_PREFIX);
            console.log('[白虎宗] DLC数据库名:', BHZ_DB_NAME);
        })();
    </script>

        // 页面加载完成后加载配置弹窗
        if (document.readyState === 'loading') {

        // 初始化人物图谱系统
        async function initCharacterGraphSystem() {
            try {
                console.log('[人物图谱] 开始初始化系统...');
                
                // 🔧 等待所有模块加载完成
                let retryCount = 0;
                const maxRetries = 30; // 3秒，每100ms检查一次
                
                while ((!window.characterGraphManager || !window.characterGraphIntegration || !window.initializeCharacterGraphHooks) && retryCount < maxRetries) {
                    console.log(`[人物图谱] ⏳ 等待所有模块加载... (${retryCount + 1}/${maxRetries})`);
                    await new Promise(resolve => setTimeout(resolve, 100));
                    retryCount++;
                }
                
                // 检查模块是否都可用
                if (!window.characterGraphManager) {
                    console.error('[人物图谱] ❌ CharacterGraphManager 未找到');
                    return;
                }
                if (!window.characterGraphIntegration) {
                    console.error('[人物图谱] ❌ CharacterGraphIntegration 未找到');
                    return;
                }
                if (!window.initializeCharacterGraphHooks) {
                    console.error('[人物图谱] ❌ CharacterGraphHooks 未找到');
                    return;
                }
                
                // 按顺序初始化
                console.log('[人物图谱] 🔄 初始化管理器...');
                await window.characterGraphManager.init();
                console.log('✅ 人物图谱管理器初始化完成');
                
                console.log('[人物图谱] 🔄 初始化集成...');
                await window.characterGraphIntegration.init();
                console.log('✅ 人物图谱集成初始化完成');
                
                console.log('[人物图谱] 🔄 初始化钩子...');
                window.initializeCharacterGraphHooks();
                console.log('✅ 人物图谱钩子初始化完成');
                
                console.log('[人物图谱] ✅ 系统初始化成功');
            } catch (error) {
                console.error('[人物图谱] ❌ 初始化失败:', error);
            }
        }
        
        // 全局函数：切换移动端tab
        function switchMobileTab(tabName) {
            console.log('[移动端Tab] 切换到:', tabName);
            
            // 移除所有active类
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector('.game-panel').classList.remove('active');
            document.querySelector('.status-panel').classList.remove('active');

            // 添加对应的active类
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');
            if (tabName === 'game') {
                document.querySelector('.game-panel').classList.add('active');
            } else if (tabName === 'status') {
                document.querySelector('.status-panel').classList.add('active');
            }
        }
    </script>

    <!-- Transformers.js - 浏览器端AI模型库（可选，仅在使用浏览器模型时需要） -->
    <script type="module" id="transformersScript">
        // 动态加载，避免影响页面加载速度
        // 调试日志开关（默认关闭）。如需查看详细日志，可在控制台执行：window.DEBUG_TRANSFORMERS = true
        window.DEBUG_TRANSFORMERS = (typeof window.DEBUG_TRANSFORMERS !== 'undefined') ? window.DEBUG_TRANSFORMERS : false;
        // 🆕 添加全局fetch拦截器以追踪模型下载进度
        window._setupProgressTracking = function() {
            if (window._progressTrackingSetup) return;
            window._progressTrackingSetup = true;
            
            const originalFetch = window.fetch;
            window.fetch = async function(...args) {
                const [url] = args;
                
                // 只拦截模型文件下载（.onnx, .json等）
                const isModelFile = typeof url === 'string' && 
                    (url.includes('onnx') || url.includes('Xenova') || url.includes('tokenizer'));
                
                if (!isModelFile || !window._modelLoadProgress) {
                    return originalFetch.apply(this, args);
                }
                
                console.log(`[模型下载] 开始下载: ${url.split('/').pop()}`);
                
                const response = await originalFetch.apply(this, args);
                
                if (!response.ok) {
                    console.error(`[模型下载] 下载失败: ${response.status} ${response.statusText}`);
                    return response;
                }
                
                const reader = response.body.getReader();
                const contentLength = +response.headers.get('Content-Length') || 0;
                const fileName = url.split('/').pop();
                
                console.log(`[模型下载] ${fileName} - 大小: ${(contentLength / 1024 / 1024).toFixed(2)} MB`);
                
                let receivedLength = 0;
                const chunks = [];
                
                while (true) {
                    const { done, value } = await reader.read();
                    
                    if (done) break;
                    
                    chunks.push(value);
                    receivedLength += value.length;
                    
                    // 更新全局进度
                    if (window._modelLoadProgress) {
                        window._modelLoadProgress.files.set(fileName, {
                            loaded: receivedLength,
                            total: contentLength
                        });
                        
                        // 计算总进度
                        let totalLoaded = 0;
                        let totalSize = 0;
                        window._modelLoadProgress.files.forEach(file => {
                            totalLoaded += file.loaded;
                            totalSize += file.total;
                        });
                        
                        window._modelLoadProgress.loaded = totalLoaded;
                        window._modelLoadProgress.total = totalSize || 15000000; // 默认15MB
                        
                        // 更新UI
                        window._updateProgressUI && window._updateProgressUI();
                    }
                }
                
                console.log(`[模型下载] ✅ ${fileName} 下载完成`);
                
                // 重新组装响应
                const chunksAll = new Uint8Array(receivedLength);
                let position = 0;
                for (let chunk of chunks) {
                    chunksAll.set(chunk, position);
                    position += chunk.length;
                }
                
                return new Response(chunksAll, {
                    status: response.status,
                    statusText: response.statusText,
                    headers: response.headers
                });
            };
        };
        
        window.loadTransformersJS = async function() {
            if (window.transformersLoaded) return;
            
            // 启动进度追踪
            window._setupProgressTracking();
            
            console.log('[Transformers.js] 开始加载库文件...');
            
            try {
                const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.6.0');
                
                // 🔧 配置远程模型和缓存
                env.allowRemoteModels = true;  // ✅ 允许从 HuggingFace CDN 下载
                env.allowLocalModels = true;   // ✅ 允许从缓存读取
                env.localModelPath = '';       // ✅ 清空本地路径，避免 404 错误
                
                window.transformers = { pipeline, env };
                window.transformersLoaded = true;
                console.log('[Transformers.js] ✅ 库加载成功');
                console.log('[Transformers.js] 本地模型基础路径:', env.localModelPath);
            } catch (error) {
                console.error('[Transformers.js] ❌ 库加载失败:', error);
                throw error;
            }
        };

        function logItemOp(op) {

            gameState.localOps.items.push(Object.assign({}, op, { ts: Date.now() }));

        function logAttrOp(op) {
            if (!gameState.localOps) gameState.localOps = { items: [], attrs: [], equip: [] };
            gameState.localOps.attrs.push(Object.assign({}, op, { ts: Date.now() }));

            if (!gameState.localOps) gameState.localOps = { items: [], attrs: [], equip: [] };
            gameState.localOps.equip.push(Object.assign({}, op, { ts: Date.now() }));
        }
    </script>

        // 构建发送给AI的消息
        async function buildAIMessages(userMessage, originalUserInput = null) {
            // 🔧 修复：确保修仙游戏规则在最顶部，直接使用 defaultSystemPrompt 作为系统提示词
            let systemPrompt;
            
            // 优先使用 defaultSystemPrompt（白虎宗游戏核心规则）
            if (typeof defaultSystemPrompt !== 'undefined') {
                systemPrompt = defaultSystemPrompt;
                console.log('[系统提示词] 🐅 使用 defaultSystemPrompt（白虎宗核心规则）作为最顶部系统提示词');
            } else if (typeof getSystemPrompt === 'function') {
                systemPrompt = getSystemPrompt();
                console.log('[系统提示词] 🎮 使用 getSystemPrompt() 作为系统提示词');
            } else {
                systemPrompt = document.getElementById('systemPrompt').value || '你是一个修仙世界的游戏主持人。';
                console.log('[系统提示词] 📝 使用 textarea 内容作为系统提示词');
            }
            
            console.log('[系统提示词] 📏 最终系统提示词长度:', systemPrompt.length);
            console.log('[系统提示词] 📋 前100字符:', systemPrompt.substring(0, 100));
            const historyDepthInput = document.getElementById('historyDepth');
            const historyDepth = historyDepthInput ? parseInt(historyDepthInput.value) : 10;
            const minWordCountInput = document.getElementById('minWordCount');
            const minWordCount = minWordCountInput ? parseInt(minWordCountInput.value) : 0;
            
            // 获取叙事视角设置
            const narrativePerspectiveInput = document.getElementById('narrativePerspective');
            const narrativePerspective = narrativePerspectiveInput ? narrativePerspectiveInput.value : 'first';
            
            console.log('[叙事视角] 当前设置的视角:', narrativePerspective);
            
            // 检查是否启用向量检索
            const enableVectorRetrieval = document.getElementById('enableVectorRetrieval')?.checked || false;
            
            let messages = [];

            // 添加系统提示
            let finalSystemPrompt = systemPrompt;
            
            // 叙事视角在非向量检索模式下作为独立消息（最优先级）
            if (!enableVectorRetrieval) {
                const perspectivePrompts = {
                    'first': '【极其重要】叙事视角强制要求：故事描写需要以主角第一人称视角为主，允许自然叙述与对话',
            'second': '【极其重要】叙事视角强制要求：故事描写需要以主角第二人称视角为主，允许自然叙述与对话',
            'third': '【极其重要】叙事视角强制要求：故事描写需要以主角第三人称视角为主，允许自然叙述与对话'
                };
                
                // 叙事视角作为第一个系统消息
                messages.unshift({
                    role: 'system',
                    content: perspectivePrompts[narrativePerspective]
                });
                
                console.log('[叙事视角] 添加的提示词:', perspectivePrompts[narrativePerspective]);
            }
            
            // 设置全局叙事视角变量，供向量检索模式使用
            window.currentNarrativePerspective = narrativePerspective;
            
            if (minWordCount > 0) {
                finalSystemPrompt += `\n\n【重要】字数要求：你的回复中"story"字段必须至少包含${minWordCount}个中文字符。请确保剧情描写详细、生动、充实，达到字数要求。`;
            }
            
            // 再次强化叙事视角要求（在系统提示词末尾）
            const reinforcementText = {
                'first': '\n\n【最终提醒】严格遵守叙事视角：必须使用第一人称"我"，绝对禁止使用"你"或"他/她"描述主角！好的，我已完整输出，谢谢您的使用！',
                'second': '\n\n【最终提醒】严格遵守叙事视角：必须使用第二人称"你"，绝对禁止使用"我"或"他/她"描述主角！好的，我已完整输出，谢谢您的使用！',
                'third': '\n\n【最终提醒】严格遵守叙事视角：必须使用第三人称"他/她"，绝对禁止使用"我"或"你"描述主角！好的，我已完整输出，谢谢您的使用！'
            };
            finalSystemPrompt += reinforcementText[narrativePerspective];
            
            // 【新增】如果启用向量检索，使用优化后的上下文构建
            if (enableVectorRetrieval && window.contextVectorManager) {
                console.log('[向量检索模式] 使用智能上下文构建');
                // 构建包含实际属性的变量状态
                const variablesForAI = {
                    ...gameState.variables,
                    attributes: calculateActualAttributes() // 使用实际属性（包含装备加成）
                };
                // 🔧 关键修复：传入原始用户输入用于向量检索
                const inputForRetrieval = originalUserInput || userMessage;
                messages = await window.contextVectorManager.buildOptimizedMessages(
                    finalSystemPrompt,
                    variablesForAI,
                    userMessage,
                    historyDepth,
                    gameState.conversationHistory,
                    inputForRetrieval  // 👈 新增：用于向量检索的原始输入
                );
                
                // 🎨 如果启用了 NovelAI 文生图，在用户消息之前注入插图提示词
                if (window.novelAIGenerator && window.novelAIGenerator.enabled && window.novelAIGenerator.imagePromptTemplate) {
                    const novelAIPrompt = window.novelAIGenerator.getInjectionPrompt();
                    if (novelAIPrompt) {
                        // 找到最后一个 user 消息的位置，在其之前插入
                        const lastUserIndex = messages.map(m => m.role).lastIndexOf('user');
                        if (lastUserIndex > 0) {
                            messages.splice(lastUserIndex, 0, {
                                role: 'system',
                                content: novelAIPrompt.trim()
                            });
                            console.log('[NovelAI] 🎨 已注入插图生成提示词到向量检索上下文');
                        }
                    }
                }
                
                return messages;
            }
            
            // 【原有逻辑】不使用向量检索的情况
            messages.push({
                role: 'system',
                content: finalSystemPrompt
            });

            // 添加当前变量状态（使用实际属性，包含装备加成）
            const variablesForAI = {
                ...gameState.variables,
                attributes: calculateActualAttributes() // 使用实际属性（包含装备加成）
            };
            messages.push({
                role: 'system',
                content: '当前角色变量状态：\n```json\n' + JSON.stringify(variablesForAI, null, 2) + '\n```'
            });

            // 根据历史层数控制添加对话历史
            if (historyDepth > 0) {
                // 发送最近N层的对话（只发送剧情内容，不发送选项）
                const recentHistory = gameState.conversationHistory.slice(-historyDepth * 2); // 乘2因为包含用户和AI的消息
                messages = messages.concat(recentHistory);
            }
            // 如果historyDepth为0，则不添加任何对话历史

            // 🎨 如果启用了 NovelAI 文生图，在用户消息之前注入插图提示词
            let finalUserMessage = userMessage;
            if (window.novelAIGenerator && window.novelAIGenerator.enabled && window.novelAIGenerator.imagePromptTemplate) {
                const novelAIPrompt = window.novelAIGenerator.getInjectionPrompt();
                if (novelAIPrompt) {
                    messages.push({
                        role: 'system',
                        content: novelAIPrompt.trim()
                    });
                    console.log('[NovelAI] 🎨 已注入插图生成提示词到上下文');
                }
            }

            // 添加用户消息
            messages.push({
                role: 'user',
                content: finalUserMessage
            });

            return messages;
        }







        // 开始游戏
        async function startGame() {
            if (gameState.isProcessing) return;

            if (typeof window.isApiConfigured === 'function' ? !window.isApiConfigured() : (!apiConfig.endpoint || !apiConfig.key)) {
                alert('请先配置API连接（可在 Cloudflare 后台设置 AI_API_KEY）');
                return;
            }

            gameState.isProcessing = true;

            // 🔧 将 initPrompt 提升到外部作用域，供 catch 使用
            let initPrompt = '开始游戏，生成剧情及选项。';

            try {
                // 构建角色初始化提示
                if (gameState.characterInfo) {
                    const info = gameState.characterInfo;
                    initPrompt = `开始游戏。角色信息：姓名${info.name}，年龄${info.age}岁，性别${info.gender}，性格${info.personality}。出身：${info.origin}。难度：${info.difficulty}。`;
                    if (info.talents && info.talents.length > 0) {
                        initPrompt += `天赋：${info.talents.join('、')}。`;
                    }
                    if (info.customSettings) {
                        initPrompt += `特殊设定：${info.customSettings}。`;
                    }
                    initPrompt += `请根据这些信息，生成一个引人入胜的开局剧情和选项。`;
                    
                    // 【关键要求】字数要求和变量更新
                    initPrompt += `\n\n【重要】字数要求：minWordCount=${document.getElementById('minWordCount').value}，所有后续剧情回复都必须达到或超过此字数。`;
                    initPrompt += `\n【重要】变量更新：必须在variables中包含完整的角色基础信息、六维属性(attributes)、势力信息(faction)、人际关系(relationships)、道具(items)、历史记录(history)等字段。`;
                    initPrompt += `\n【重要】新角色生成：当剧情中出现新角色时，必须在variableUpdate中更新该角色的完整信息。`;                  
                }

                // 将初始化提示添加到历史记录中，以便重新生成功能能正常工作
                gameState.conversationHistory.push({
                    role: 'user',
                    content: initPrompt
                });

                const response = await callAI(initPrompt);

                // 清空游戏历史区域（移除加载提示）
                document.getElementById('gameHistory').innerHTML = '';

                // 显示初始化消息
                displayUserMessage(initPrompt);

                handleAIResponse(response);
                gameState.isGameStarted = true;

                // 保存游戏历史（标记游戏已开始）
                await saveGameHistory();

                // 触发动态世界生成（异步，不阻塞主流程）
                generateDynamicWorld().catch(err => console.error('[动态世界] 生成异常:', err));

            } catch (error) {
                // ❌ 不要清空历史！只移除加载提示
                const loadingMsg = document.querySelector('#gameHistory .message.ai-message');
                if (loadingMsg && loadingMsg.textContent.includes('AI生成开局剧情中')) {
                    loadingMsg.remove();
                }

                // 显示用户消息（如果还没显示）
                if (document.getElementById('gameHistory').children.length === 0) {
                    displayUserMessage(initPrompt);
                }

                // 显示错误消息和重试按钮
                displayErrorMessageWithRetry('游戏启动失败：' + error.message + '\n\n可能原因：网络超时、API密钥错误、模型不可用', async () => {
                    // 移除错误消息
                    dismissError();
                    
                    // 🔧 从历史记录中移除失败的请求（避免重复）
                    const lastMsg = gameState.conversationHistory[gameState.conversationHistory.length - 1];
                    if (lastMsg && lastMsg.role === 'user' && lastMsg.content === initPrompt) {
                        gameState.conversationHistory.pop();
                        gameState.variableSnapshots.pop(); // 同时移除快照
                    }
                    
                    // 重新开始游戏
                    await startGame();
                });
            }

            gameState.isProcessing = false;
        }

        // 处理AI响应
        function handleAIResponse(response) {
            // 调试模式：直接显示原始响应，不做任何解析或渲染处理
            const debugCheckbox = document.getElementById('debugMode');
            if (debugCheckbox && debugCheckbox.checked) {
                appendDebug('AI', response);
                // 调试模式下仅展示，不入库与变量更新
                return;
            }

            // ✅ 使用增强版JSON处理工具（保证不会失败）
            let data;
            try {
                data = processAIResponse(response);
            } catch (error) {
                console.error('❌ processAIResponse异常:', error);
                // 降级方案：构造最小可用数据
                data = {
                    reasoning: { situation: '解析异常', playerChoice: '', logicChain: [], outcome: '' },
                    variableChanges: { analysis: 'Parse error', changes: {} },
                    story: '系统错误：AI响应解析失败\n\n' + response.substring(0, 500),
                    options: ['重新生成', '尝试继续', '查看日志', '返回菜单', '保存退出']
                };
            }

            // 更新变量（支持三种格式）
            if (data.variableUpdate) {
                try {
                    // v3.1 简化格式（推荐）
                    console.log('[v3.1] 🎯 使用 v3.1 简化格式更新变量');
                    
                    // 初始化 v3.1 解析器
                    if (!window.v31Parser) {
                        window.v31Parser = new VariableInstructionParserV31(gameState, {
                            debug: true,
                            enableRollback: false
                        });
                    }
                    
                    // 解析并执行变量更新
                    const result = window.v31Parser.execute(data.variableUpdate);
                    console.log('[v3.1] ✅ 更新结果:', result);
                    
                    updateStatusPanel();
                    showAttributeChanges();
                } catch (error) {
                    console.error('❌ v3.1 变量更新失败:', error);
                }
            } else if (data.variableChanges) {
                try {
                    // 旧方案：增量更新
                    applyVariableChanges(data.variableChanges);
                    updateStatusPanel();
                    showAttributeChanges();
                } catch (error) {
                    console.error('❌ 变量更新失败:', error);
                }
            } else if (data.variables) {
                try {
                    // 旧方案：完整变量表单（向后兼容）
                    updateVariables(data.variables);
                    updateStatusPanel(); // 添加状态面板更新
                    showAttributeChanges(); // 添加属性变化显示
                } catch (error) {
                    console.error('❌ 变量更新失败（旧方案）:', error);
                }
            }

            // 处理stats字段（转换为variables中的attributes）
            if (data.stats) {
                try {
                    if (!gameState.variables.attributes) {
                        gameState.variables.attributes = {};
                    }
                    
                    // 将stats中的属性值合并到attributes中
                    Object.assign(gameState.variables.attributes, data.stats);
                    console.log('[属性更新] 📊 从stats字段更新属性:', data.stats);
                    
                    // 更新UI
                    updateStatusPanel();
                    showAttributeChanges();
                } catch (error) {
                    console.error('❌ stats字段处理失败:', error);
                }
            }

            // 添加到历史记录（保存剧情 + 原始响应/JSON + imgPrompt）
            if (data.story) {
                gameState.conversationHistory.push({
                    role: 'assistant',
                    content: data.story,
                    rawResponse: response,
                    parsed: data,
                    imgPrompt: data.img || null  // 🎨 保存图片提示词用于存档恢复
                });

                // 保存当前变量快照
                gameState.variableSnapshots.push(JSON.parse(JSON.stringify(gameState.variables)));
                
                // 【新增】如果启用向量检索，添加到向量库
                const enableVectorRetrieval = document.getElementById('enableVectorRetrieval')?.checked || false;
                if (enableVectorRetrieval && window.contextVectorManager && gameState.conversationHistory.length >= 2) {
                    const turnIndex = Math.floor(gameState.conversationHistory.length / 2);
                    const userMessage = gameState.conversationHistory[gameState.conversationHistory.length - 2].content;
                    const aiResponse = data.story;
                    
                    // 异步添加到向量库（不阻塞游戏流程）
                    window.contextVectorManager.addConversation(
                        userMessage,
                        aiResponse,
                        turnIndex,
                        gameState.variables
                    ).then(() => {
                        // 🆕 提取并向量化history
                        if (data.variableUpdate && data.variableUpdate.history) {
                            // 如果是v3.1格式，history可能在variableUpdate中
                            const historyArray = Array.isArray(data.variableUpdate.history) 
                                ? data.variableUpdate.history 
                                : [data.variableUpdate.history];
                            
                            return window.contextVectorManager.addHistoryToVectorLib(historyArray, turnIndex);
                        } else if (gameState.variables.history && Array.isArray(gameState.variables.history) && gameState.variables.history.length > 0) {
                            // 如果history在variables中（已经被v3.1解析器更新）
                            // 只向量化最新添加的history（假设是最后一条）
                            const latestHistory = gameState.variables.history.slice(-1);
                            return window.contextVectorManager.addHistoryToVectorLib(latestHistory, turnIndex);
                        }
                    }).then(() => {
                        // 🆕 重建history矩阵（确保所有向量都被正确分层）
                        if (window.matrixManager && window.contextVectorManager.historyEmbeddings.length > 0) {
                            // 清空并重建整个矩阵，确保正确的分层
                            window.matrixManager.historyMatrix.clear();
                            window.matrixManager.initializeHistoryMatrix().then(data => {
                                if (data && data.stats.totalLayers > 0) {
                                    console.log(`[History矩阵] 自动重建完成：${data.stats.totalLayers}层，${data.stats.totalVectors}个向量`);
                                }
                            }).catch(error => {
                                console.warn('[History矩阵] 自动重建失败:', error.message);
                            });
                        }
                        
                        // 保存向量库到IndexedDB
                        return window.contextVectorManager.saveToIndexedDB();
                    }).catch(err => {
                        console.error('❌ 向量库添加失败:', err);
                        console.error('错误详情:', err.stack);
                        
                        // 自动回退到关键词方法
                        const currentMethod = window.contextVectorManager.embeddingMethod;
                        if (currentMethod !== 'keyword') {
                            console.warn(`[向量库] ${currentMethod}方法失败，自动切换到关键词方法`);
                            window.contextVectorManager.setEmbeddingMethod('keyword');
                            document.getElementById('vectorMethod').value = 'keyword';
                            
                            // 提示用户
                            setTimeout(() => {
                                alert(`⚠️ 向量化失败\n\n${currentMethod}方法出现错误，已自动切换到"关键词匹配"方法\n\n错误：${err.message}\n\n游戏将正常继续，不影响使用。`);
                            }, 1000);
                        }
                    });
                }
            }

            // 正常显示消息（传入 img 字段用于 NovelAI 生图）
            displayAIMessage(data.story, data.options, data.reasoning, data.img);
            
            // 保存游戏历史到 IndexedDB
            saveGameHistory().catch(err => console.error('保存历史失败:', err));

            if (gameState && gameState.localOps) {
                gameState.localOps = { items: [], attrs: [], equip: [] };
            }
        }

        // 调试模式：切换显示区域
        // 调试模式相关函数已迁移到 game-initialization.js

        // 恢复对话历史显示
        // restoreConversationHistory 已迁移到 game-initialization.js

        /**
         * 应用增量变量更新（新方案）
         * @param {Object} variableChanges - AI返回的variableChanges对象
         * @returns {Object} 更新后的变量状态
         */
        function applyVariableChanges(variableChanges) {
            if (!variableChanges) {
                console.warn('[变量更新] 没有变量变化数据');
                return gameState.variables;
            }

            const { analysis, changes = {}, arrayChanges, newFields = [], removedFields = [] } = variableChanges;

            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
            console.log('[变量更新] 开始应用增量更新');
            if (analysis) {
                console.log('[变量更新] 分析:', analysis);
            }
            if (Object.keys(changes).length > 0) {
                console.log('[变量更新] 变化字段:', Object.keys(changes));
            }
            if (arrayChanges) {
                console.log('[变量更新] 数组增量更新:', Object.keys(arrayChanges));
            }
            if (newFields.length > 0) {
                console.log('[变量更新] 新增字段:', newFields);
            }
            if (removedFields.length > 0) {
                console.log('[变量更新] 删除字段:', removedFields);
            }

            // 保存之前的变量状态用于计算变化
            gameState.previousVariables = JSON.parse(JSON.stringify(gameState.variables));

            // 1. 处理普通字段变化
            for (const [key, value] of Object.entries(changes)) {
                applyFieldChange(key, value);
            }

            // 2. 处理数组字段增量更新（新功能）
            if (arrayChanges) {
                applyArrayChanges(arrayChanges);
            }

            // 3. 删除标记为移除的字段
            removedFields.forEach(field => {
                if (gameState.variables.hasOwnProperty(field)) {
                    delete gameState.variables[field];
                    console.log(`[变量更新] ❌ 删除字段: ${field}`);
                }
            });

            console.log('[变量更新] ✅ 增量更新完成');
            console.log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');

            return gameState.variables;
        }

        /**
         * 应用数组字段的增量更新（add/remove/update模式）
         * @param {Object} arrayChanges - 数组增量更新对象
         */
        function applyArrayChanges(arrayChanges) {
            for (const [arrayName, operations] of Object.entries(arrayChanges)) {
                if (!gameState.variables[arrayName]) {
                    gameState.variables[arrayName] = [];
                }

                const array = gameState.variables[arrayName];
                const emoji = {
                    'items': '🎒',
                    'relationships': '👥',
                    'techniques': '📖',
                    'spells': '✨'
                }[arrayName] || '📝';

                console.log(`[数组更新] ${emoji} 处理 ${arrayName}:`);

                // 检查是否是直接数组格式（AI返回的格式）
                if (Array.isArray(operations)) {
                    console.log(`  📋 检测到直接数组格式，处理 ${operations.length} 个项目`);
                    operations.forEach(item => {
                        addToArray(array, item, arrayName);
                    });
                } else {
                    // 标准操作格式 { add: [...], remove: [...], update: [...] }
                    // 1. 处理删除操作
                    if (operations.remove && operations.remove.length > 0) {
                        operations.remove.forEach(item => {
                            removeFromArray(array, item, arrayName);
                        });
                    }

                    // 2. 处理新增操作
                    if (operations.add && operations.add.length > 0) {
                        operations.add.forEach(item => {
                            addToArray(array, item, arrayName);
                        });
                    }

                    // 3. 处理更新操作
                    if (operations.update && operations.update.length > 0) {
                        operations.update.forEach(item => {
                            updateInArray(array, item, arrayName);
                        });
                    }
                }
            }
        }

        /**
         * 从数组中删除元素或减少数量
         * @param {Array} array - 目标数组
         * @param {Object} item - 要删除的元素
         * @param {string} arrayName - 数组名称
         */
        function removeFromArray(array, item, arrayName) {
            const index = array.findIndex(el => el.name === item.name);

            if (index === -1) {
                console.warn(`  ⚠️ 尝试删除不存在的${arrayName}: ${item.name}`);
                return;
            }

            // 如果是items且指定了count，则减少数量
            if (arrayName === 'items' && item.count !== undefined) {
                const oldCount = array[index].count;
                array[index].count -= item.count;
                console.log(`  ➖ ${item.name}: 数量 -${item.count} (${oldCount} → ${array[index].count})`);

                // 如果数量<=0，则完全删除
                if (array[index].count <= 0) {
                    array.splice(index, 1);
                    console.log(`  ❌ ${item.name}: 数量归零，已从物品列表删除`);
                }
            } else {
                // 完全删除
                array.splice(index, 1);
                console.log(`  ❌ 删除 ${item.name}`);
            }
        }

        /**
         * 向数组中添加元素或增加数量
         * @param {Array} array - 目标数组
         * @param {Object} item - 要添加的元素
         * @param {string} arrayName - 数组名称
         */
        function addToArray(array, item, arrayName) {
            const existingIndex = array.findIndex(el => el.name === item.name);

            // 如果是items且已存在，则增加数量
            if (arrayName === 'items' && existingIndex !== -1) {
                const oldCount = array[existingIndex].count;
                array[existingIndex].count += item.count;
                console.log(`  ➕ ${item.name}: 数量 +${item.count} (${oldCount} → ${array[existingIndex].count})`);

                // 更新其他字段（如果有变化）
                Object.assign(array[existingIndex], item);
            } else if (existingIndex !== -1) {
                // 其他数组类型，如果已存在则替换
                array[existingIndex] = item;
                console.log(`  🔄 替换 ${item.name}`);
            } else {
                // 不存在则新增
                array.push(item);
                const extra = arrayName === 'items' ? ` (数量: ${item.count})` : '';
                console.log(`  ✅ 新增 ${item.name}${extra}`);
            }
        }

        /**
         * 更新数组中已存在的元素
         * @param {Array} array - 目标数组
         * @param {Object} item - 要更新的元素（包含name和要更新的字段）
         * @param {string} arrayName - 数组名称
         */
        function updateInArray(array, item, arrayName) {
            const existingIndex = array.findIndex(el => el.name === item.name);

            if (existingIndex === -1) {
                console.warn(`  ⚠️ 尝试更新不存在的${arrayName}: ${item.name}`);
                return;
            }

            // 记录旧值
            const oldValues = {};
            const updatedFields = Object.keys(item).filter(k => k !== 'name');
            updatedFields.forEach(field => {
                oldValues[field] = array[existingIndex][field];
            });

            // 特殊处理：relationships数组的history字段需要追加而不是覆盖
            if (arrayName === 'relationships' && item.history && Array.isArray(item.history)) {
                const existingHistory = Array.isArray(array[existingIndex].history) ? array[existingIndex].history : [];
                const newHistory = item.history;
                
                // 去重合并：只添加不重复的历史记录
                const mergedHistory = [...existingHistory];
                let addedCount = 0;
                
                newHistory.forEach(newItem => {
                    // 检查是否已存在相同内容（去除首尾空格后比较）
                    const trimmedNew = newItem.trim();
                    const isDuplicate = mergedHistory.some(existing => existing.trim() === trimmedNew);
                    
                    if (!isDuplicate && trimmedNew) {
                        mergedHistory.push(newItem);
                        addedCount++;
                    }
                });
                
                // 更新history字段为合并后的数组
                item.history = mergedHistory;
                
                if (addedCount > 0) {
                    console.log(`    - history: 追加了 ${addedCount} 条新记录（总计：${mergedHistory.length}条）`);
                }
            }

            // 合并更新字段
            Object.assign(array[existingIndex], item);

            // 输出详细日志
            console.log(`  🔧 更新 ${item.name}:`);
            updatedFields.forEach(field => {
                if (field === 'history' && arrayName === 'relationships') {
                    // history字段已经在上面特殊处理过了，跳过详细日志
                    return;
                }
                console.log(`    - ${field}: ${JSON.stringify(oldValues[field])} → ${JSON.stringify(item[field])}`);
            });
        }

        /**
         * 应用单个字段的变化
         * @param {string} key - 字段名
         * @param {any} value - 新值
         */
        function applyFieldChange(key, value) {
            // ========== 特殊处理1：history字段使用追加模式 ==========
            if (key === 'history') {
                if (!gameState.variables.history) {
                    gameState.variables.history = [];
                }
                if (Array.isArray(value)) {
                    let addedCount = 0;
                    value.forEach(newRecord => {
                        const trimmed = newRecord.trim();
                        const isDuplicate = gameState.variables.history.some(
                            existing => existing.trim() === trimmed
                        );
                        if (!isDuplicate && trimmed) {
                            gameState.variables.history.push(newRecord);
                            addedCount++;
                            console.log(`[变量更新] 📜 新增历史: ${newRecord.substring(0, 50)}...`);
                        }
                    });
                    console.log(`[变量更新] history: 追加了 ${addedCount} 条新记录`);
                }
                return;
            }

            // ========== 特殊处理2：对象字段使用部分更新模式 ==========
            if (key === 'attributes' || key === 'equipment') {
                if (!gameState.variables[key]) {
                    gameState.variables[key] = {};
                }
                const changedKeys = Object.keys(value);
                Object.assign(gameState.variables[key], value);
                console.log(`[变量更新] 🔧 部分更新 ${key}: [${changedKeys.join(', ')}]`);

                // 详细记录每个子字段的变化
                changedKeys.forEach(subKey => {
                    const oldValue = gameState.previousVariables?.[key]?.[subKey];
                    const newValue = value[subKey];
                    if (oldValue !== undefined) {
                        console.log(`  - ${subKey}: ${JSON.stringify(oldValue)} -> ${JSON.stringify(newValue)}`);
                    } else {
                        console.log(`  - ${subKey}: (新增) ${JSON.stringify(newValue)}`);
                    }
                });
                return;
            }

            // ========== 特殊处理3：数组字段使用完整替换模式（带安全检查）==========
            if (key === 'items' || key === 'relationships' || key === 'techniques' || key === 'spells') {
                const oldCount = gameState.variables[key] ? gameState.variables[key].length : 0;
                const newCount = Array.isArray(value) ? value.length : 0;

                // 安全检查：防止数据丢失
                if (oldCount > 5 && newCount < oldCount / 2 && newCount > 0) {
                    console.warn(`⚠️ ${key}数量异常减少：从${oldCount}个减少到${newCount}个，可能存在数据丢失！`);
                    console.warn(`⚠️ 建议检查AI返回的${key}数组是否完整`);
                }

                gameState.variables[key] = value;

                const emoji = {
                    'items': '🎒',
                    'relationships': '👥',
                    'techniques': '📖',
                    'spells': '✨'
                }[key] || '📝';

                console.log(`[变量更新] ${emoji} 完整替换 ${key}: ${oldCount} -> ${newCount}`);

                // 如果是items，详细记录新增和删除的物品
                if (key === 'items' && gameState.previousVariables?.items) {
                    const oldItems = new Set(gameState.previousVariables.items.map(i => i.name));
                    const newItems = new Set(value.map(i => i.name));

                    const added = [...newItems].filter(name => !oldItems.has(name));
                    const removed = [...oldItems].filter(name => !newItems.has(name));

                    if (added.length > 0) {
                        console.log(`  ✅ 新增物品: ${added.join(', ')}`);
                    }
                    if (removed.length > 0) {
                        console.log(`  ❌ 移除物品: ${removed.join(', ')}`);
                    }
                }

                // 如果是relationships，详细记录新增和删除的关系
                if (key === 'relationships' && gameState.previousVariables?.relationships) {
                    const oldRels = new Set(gameState.previousVariables.relationships.map(r => r.name));
                    const newRels = new Set(value.map(r => r.name));

                    const added = [...newRels].filter(name => !oldRels.has(name));
                    const removed = [...oldRels].filter(name => !newRels.has(name));

                    if (added.length > 0) {
                        console.log(`  ✅ 新增关系: ${added.join(', ')}`);
                    }
                    if (removed.length > 0) {
                        console.log(`  ❌ 移除关系: ${removed.join(', ')}`);
                    }
                }

                return;
            }

            // ========== 默认处理：直接替换 ==========
            const oldValue = gameState.variables[key];
            gameState.variables[key] = value;

            // 根据字段类型选择合适的emoji
            const emoji = {
                'hp': '❤️',
                'mp': '💙',
                'spiritStones': '💰',
                'age': '📅',
                'realm': '⚡',
                'location': '📍',
                'karmaFortune': '🍀',
                'karmaPunishment': '⚠️',
                'cultivationProgress': '📈',
                'faction': '🏛️'
            }[key] || '🔄';

            if (oldValue !== undefined && oldValue !== value) {
                console.log(`[变量更新] ${emoji} ${key}: ${JSON.stringify(oldValue)} -> ${JSON.stringify(value)}`);
            } else {
                console.log(`[变量更新] ${emoji} ${key}: (新增) ${JSON.stringify(value)}`);
            }
        }

        // 更新变量（旧方案，保留用于向后兼容）
        function updateVariables(newVars) {
            // 保存之前的变量状态用于计算变化
            gameState.previousVariables = JSON.parse(JSON.stringify(gameState.variables));

            // 合并变量
            if (newVars.currentDateTime !== undefined) gameState.variables.currentDateTime = newVars.currentDateTime;
            if (newVars.name !== undefined) gameState.variables.name = newVars.name;
            if (newVars.age !== undefined) gameState.variables.age = newVars.age;
            if (newVars.gender !== undefined) gameState.variables.gender = newVars.gender;
            if (newVars.realm !== undefined) gameState.variables.realm = newVars.realm;
            if (newVars.identity !== undefined) gameState.variables.identity = newVars.identity;
            if (newVars.spiritStones !== undefined) gameState.variables.spiritStones = newVars.spiritStones;
            if (newVars.location !== undefined) gameState.variables.location = newVars.location;
            if (newVars.karmaFortune !== undefined) gameState.variables.karmaFortune = newVars.karmaFortune;
            if (newVars.karmaPunishment !== undefined) gameState.variables.karmaPunishment = newVars.karmaPunishment;
            if (newVars.cultivationProgress !== undefined) gameState.variables.cultivationProgress = newVars.cultivationProgress;
            if (newVars.cultivationProgressMax !== undefined) gameState.variables.cultivationProgressMax = newVars.cultivationProgressMax;
            if (newVars.hp !== undefined) gameState.variables.hp = newVars.hp;
            if (newVars.hpMax !== undefined) gameState.variables.hpMax = newVars.hpMax;
            if (newVars.mp !== undefined) gameState.variables.mp = newVars.mp;
            if (newVars.mpMax !== undefined) gameState.variables.mpMax = newVars.mpMax;
            if (newVars.talents !== undefined) gameState.variables.talents = newVars.talents;

            // 更新炼丹炼器等级
            if (newVars.alchemyLevel !== undefined) gameState.variables.alchemyLevel = newVars.alchemyLevel;
            if (newVars.craftingLevel !== undefined) gameState.variables.craftingLevel = newVars.craftingLevel;

            // 更新势力信息
            if (newVars.faction !== undefined) gameState.variables.faction = newVars.faction;

            // 更新属性
            if (newVars.attributes) {
                Object.assign(gameState.variables.attributes, newVars.attributes);
            }

            // 更新装备
            if (newVars.equipment) {
                Object.assign(gameState.variables.equipment, newVars.equipment);
            }

            // 更新道具（完全替换，带安全检查）
            if (newVars.items) {
                const oldCount = gameState.variables.items ? gameState.variables.items.length : 0;
                const newCount = newVars.items.length;
                if (oldCount > 5 && newCount < oldCount / 2 && newCount > 0) {
                    console.warn(`⚠️ 道具数量异常减少：从${oldCount}个减少到${newCount}个，可能存在数据丢失！`);
                }

                if (!Array.isArray(gameState.variables.items)) {
                    gameState.variables.items = [];
                }

                const nameIndex = new Map(gameState.variables.items.map(i => [i.name, i]));
                const equippedNames = new Set(Object.values(gameState.variables.equipment || {})
                    .filter(e => e && e.name)
                    .map(e => e.name));
                for (const incoming of newVars.items) {
                    if (!incoming || !incoming.name) continue;
                    const existing = nameIndex.get(incoming.name);
                    const isEquipped = equippedNames.has(incoming.name);
                    if (existing) {
                        if (incoming.type !== undefined) existing.type = incoming.type;
                        if (incoming.effects !== undefined) existing.effects = incoming.effects;
                        if (incoming.count !== undefined) {
                            if (incoming._op === 'set') {
                                existing.count = incoming.count;
                            } else if (incoming._op === 'decrease') {
                                existing.count = Math.max(0, (existing.count || 0) - incoming.count);
                            } else if (incoming._op === 'increase') {
                                existing.count = (existing.count || 0) + (incoming.count || 1);
                            } else {
                                // 默认为快照：不对已装备物品回仓，且不减少本地消费
                                if (isEquipped) {
                                    existing.count = Math.max((existing.count || 0), 0);
                                } else {
                                    existing.count = Math.max((existing.count || 0), incoming.count || 0);
                                }
                            }
                        }
                    } else {
                        // 没有本地记录：若该物品当前已装备且AI未提供_op，则视为装备来源，避免回仓重复
                        if (isEquipped && !incoming._op) {
                            continue;
                        }
                        gameState.variables.items.push({
                            name: incoming.name,
                            count: incoming._op === 'set' ? (incoming.count ?? 1) : (incoming.count ?? 1),
                            type: incoming.type,
                            effects: incoming.effects
                        });
                    }
                }
            }

            // 更新功法（完全替换，带安全检查）
            if (newVars.techniques) {
                const oldCount = gameState.variables.techniques ? gameState.variables.techniques.length : 0;
                const newCount = newVars.techniques.length;
                if (oldCount > 3 && newCount < oldCount / 2 && newCount > 0) {
                    console.warn(`⚠️ 功法数量异常减少：从${oldCount}个减少到${newCount}个，可能存在数据丢失！`);
                }
                gameState.variables.techniques = newVars.techniques;
            }

            // 更新法术（完全替换，带安全检查）
            if (newVars.spells) {
                const oldCount = gameState.variables.spells ? gameState.variables.spells.length : 0;
                const newCount = newVars.spells.length;
                if (oldCount > 3 && newCount < oldCount / 2 && newCount > 0) {
                    console.warn(`⚠️ 法术数量异常减少：从${oldCount}个减少到${newCount}个，可能存在数据丢失！`);
                }
                gameState.variables.spells = newVars.spells;
            }

            // 更新人际关系（完全替换，带安全检查）
            if (newVars.relationships) {
                const oldCount = gameState.variables.relationships ? gameState.variables.relationships.length : 0;
                const newCount = newVars.relationships.length;
                if (oldCount > 3 && newCount < oldCount / 2 && newCount > 0) {
                    console.warn(`⚠️ 人际关系数量异常减少：从${oldCount}个减少到${newCount}个，可能存在数据丢失！`);
                }
                gameState.variables.relationships = newVars.relationships;
            }

            // 更新历史（追加模式 - 只添加新记录，不删除旧记录）
            if (newVars.history && Array.isArray(newVars.history)) {
                // 确保history数组存在
                if (!gameState.variables.history) {
                    gameState.variables.history = [];
                }
                
                // 追加新历史记录（去重：避免添加完全相同的记录）
                newVars.history.forEach(newRecord => {
                    const trimmedNew = newRecord.trim();
                    // 检查是否已存在相同内容（去除首尾空格后比较）
                    const isDuplicate = gameState.variables.history.some(existing => 
                        existing.trim() === trimmedNew
                    );
                    
                    if (!isDuplicate && trimmedNew) {
                        gameState.variables.history.push(newRecord);
                        console.log('[历史记录] 新增:', newRecord.substring(0, 50) + '...');
                    }
                });
            }

            // 更新UI
            updateStatusPanel();

            // 显示属性变化
            showAttributeChanges();
        }

        // 更新状态面板
        function updateStatusPanel() {
            const vars = gameState.variables;

            // 使用配置文件中的渲染函数
            if (window.XiuxianGameConfig && window.XiuxianGameConfig.renderStatus) {
                window.XiuxianGameConfig.renderStatus(vars);
                return;
            }

            // 以下是备用渲染代码（如果配置文件未加载）

            // 时间
            document.getElementById('currentDateTime').textContent = vars.currentDateTime || '-';

            // 基本信息
            document.getElementById('charName').textContent = vars.name || '未知';
            document.getElementById('charAge').textContent = vars.age || '-';
            document.getElementById('charGender').textContent = vars.gender || '-';
            document.getElementById('charIdentity').textContent = vars.identity || '-';
            document.getElementById('charRealm').textContent = vars.realm || '-';
            document.getElementById('charLocation').textContent = vars.location || '-';
            document.getElementById('charTalents').textContent = vars.talents && vars.talents.length > 0 ? vars.talents.join('、') : '-';

            // 货币
            document.getElementById('spiritStones').textContent = vars.spiritStones || 0;

            // 体力法力
            const hp = vars.hp || 0;

        // 计算实际属性（基础 + 装备加成）
        // 计算当前实际属性（包含装备加成）- 已迁移到 game-core-systems.js

        // 绘制六维属性雷达图
        function drawRadarChart() {
            const canvas = document.getElementById('radarChart');
            if (!canvas) return;

            // 设置 Canvas 响应式尺寸
            const container = canvas.parentElement;
            const containerWidth = container.clientWidth;
            
            // 动态计算尺寸，设置最小值200px，最大值300px
            let size = Math.max(Math.min(containerWidth - 20, 300), 200);
            
            // 根据尺寸动态调整标签留白空间
            let labelPadding = 40; // 默认留白
            let fontSize = 12; // 默认字体大小
            let valueFontSize = 10; // 数值字体大小
            
            if (size < 220) {
                labelPadding = 30;
                fontSize = 10;
                valueFontSize = 9;
            } else if (size < 260) {
                labelPadding = 35;
                fontSize = 11;
                valueFontSize = 9;
            }
            
            // 设置 Canvas 实际像素尺寸（高分辨率支持）
            const dpr = window.devicePixelRatio || 1;
            canvas.width = size * dpr;
            canvas.height = size * dpr;
            
            // 设置 CSS 显示尺寸
            canvas.style.width = size + 'px';
            canvas.style.height = size + 'px';
            
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);

            // 获取实际属性值
            const actualAttributes = calculateActualAttributes();
            
            // 六维属性配置
            const attributes = [
                { key: 'physique', label: '根骨', value: actualAttributes.physique || 0 },
                { key: 'fortune', label: '气运', value: actualAttributes.fortune || 0 },
                { key: 'comprehension', label: '悟性', value: actualAttributes.comprehension || 0 },
                { key: 'spirit', label: '神识', value: actualAttributes.spirit || 0 },
                { key: 'potential', label: '潜力', value: actualAttributes.potential || 0 },
                { key: 'charisma', label: '魅力', value: actualAttributes.charisma || 0 }
            ];

            // 计算最大值（用于缩放）
            const maxValue = Math.max(...attributes.map(a => a.value), 100);
            const levels = 5; // 5个层级
            const center = size / 2;
            const radius = size / 2 - labelPadding; // 动态调整标签空间

            // 清空画布
            ctx.clearRect(0, 0, size, size);

            // 绘制背景网格
            ctx.strokeStyle = 'rgba(139, 69, 19, 0.2)';
            ctx.fillStyle = 'rgba(139, 69, 19, 0.05)';
            
            for (let i = levels; i > 0; i--) {
                ctx.beginPath();
                const r = (radius / levels) * i;
                
                for (let j = 0; j < 6; j++) {
                    const angle = (Math.PI * 2 / 6) * j - Math.PI / 2;
                    const x = center + r * Math.cos(angle);
                    const y = center + r * Math.sin(angle);
                    
                    if (j === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            // 绘制分隔线
            ctx.strokeStyle = 'rgba(139, 69, 19, 0.3)';
            ctx.lineWidth = 1;
            
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI * 2 / 6) * i - Math.PI / 2;
                const x = center + radius * Math.cos(angle);
                const y = center + radius * Math.sin(angle);
                
                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.lineTo(x, y);
                ctx.stroke();
            }

            // 绘制属性数据区域
            ctx.fillStyle = 'rgba(139, 69, 19, 0.3)';
            ctx.strokeStyle = 'rgba(139, 69, 19, 0.8)';
            ctx.lineWidth = 2;
            ctx.beginPath();

            attributes.forEach((attr, index) => {
                const angle = (Math.PI * 2 / 6) * index - Math.PI / 2;
                const valueRadius = (attr.value / maxValue) * radius;
                const x = center + valueRadius * Math.cos(angle);
                const y = center + valueRadius * Math.sin(angle);
                
                if (index === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });

            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 绘制数据点
            ctx.fillStyle = 'rgba(139, 69, 19, 0.9)';
            attributes.forEach((attr, index) => {
                const angle = (Math.PI * 2 / 6) * index - Math.PI / 2;
                const valueRadius = (attr.value / maxValue) * radius;
                const x = center + valueRadius * Math.cos(angle);
                const y = center + valueRadius * Math.sin(angle);
                
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // 绘制属性标签和数值
            ctx.fillStyle = '#8b4513';
            ctx.font = `bold ${fontSize}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            attributes.forEach((attr, index) => {
                const angle = (Math.PI * 2 / 6) * index - Math.PI / 2;
                const labelRadius = radius + (labelPadding * 0.75); // 标签距离稍微调整
                let x = center + labelRadius * Math.cos(angle);
                let y = center + labelRadius * Math.sin(angle);
                
                // 调整文本对齐方式
                if (Math.abs(angle) < 0.1) {
                    ctx.textAlign = 'center';
                } else if (Math.cos(angle) > 0) {
                    ctx.textAlign = 'left';
                } else {
                    ctx.textAlign = 'right';
                }
                
                // 绘制标签
                ctx.fillText(attr.label, x, y - (fontSize * 0.6));
                
                // 绘制数值
                ctx.font = `${valueFontSize}px Arial`;
                ctx.fillStyle = '#666';
                ctx.fillText(attr.value.toString(), x, y + (valueFontSize * 0.5));
                
                // 恢复字体
                ctx.font = `bold ${fontSize}px Arial`;
                ctx.fillStyle = '#8b4513';
            });
        }

        // 装备道具
        function equipItem(itemName) {
            const item = gameState.variables.items.find(i => i.name === itemName);
            if (!item || !item.type || !item.type.startsWith('装备-')) {
                alert('该物品不能装备');
                return;
            }

            let equipSlot = null;
            switch (item.type) {
                case '装备-头部':
                    equipSlot = 'head';
                    break;
                case '装备-衣服':
                    equipSlot = 'clothes';
                    break;
                case '装备-脚部':
                    equipSlot = 'feet';
                    break;
                case '装备-法宝':
                    // 找到第一个空的法宝位
                    if (!gameState.variables.equipment.treasure1) {
                        equipSlot = 'treasure1';
                    } else if (!gameState.variables.equipment.treasure2) {
                        equipSlot = 'treasure2';
                    } else if (!gameState.variables.equipment.treasure3) {
                        equipSlot = 'treasure3';
                    } else {
                        alert('法宝位已满，请先卸下一个法宝');
                        return;
                    }
                    break;
                default:
                    alert('未知的装备类型');
                    return;
            }

            // 卸下原有装备（如果有）
            if (gameState.variables.equipment[equipSlot]) {
                const oldItem = gameState.variables.equipment[equipSlot];
                // 将旧装备放回背包
                const existingItem = gameState.variables.items.find(i => i.name === oldItem.name);
                if (existingItem) {
                    existingItem.count++;
                } else {
                    gameState.variables.items.push({
                        name: oldItem.name,
                        count: 1,
                        type: oldItem.type || '装备-未知',
                        effects: oldItem.effects
                    });
                }
            }

            // 装备新物品
            gameState.variables.equipment[equipSlot] = {
                name: item.name,
                type: item.type,
                effects: item.effects || {}
            };

            // 从背包中移除一个
            item.count--;
            if (item.count <= 0) {
                const index = gameState.variables.items.indexOf(item);
                gameState.variables.items.splice(index, 1);
            }

            // 🆕 记录装备操作到缓存（只记录最后装备的）
            gameState.pendingActions.equipment = item.name;

            // 更新UI
            updateStatusPanel();

            // 保存游戏状态
            saveGameHistory().catch(err => console.error('保存失败:', err));
        }

        // 卸下装备
        function unequipItem(slot) {
            const equipment = gameState.variables.equipment[slot];
            if (!equipment) {
                return; // 没有装备，不做任何操作
            }

            // 将装备放回背包
            const existingItem = gameState.variables.items.find(i => i.name === equipment.name);
            if (existingItem) {
                existingItem.count++;
            } else {
                gameState.variables.items.push({
                    name: equipment.name,
                    count: 1,
                    type: equipment.type || '装备-未知',
                    effects: equipment.effects
                });
            }

            // 清空装备栏
            gameState.variables.equipment[slot] = null;

            // 更新UI
            updateStatusPanel();

            // 保存游戏状态
            saveGameHistory().catch(err => console.error('保存失败:', err));
        }

        // 服用丹药
        function usePill(itemIndex) {
            const item = gameState.variables.items[itemIndex];
            if (!item || !item.type || !(item.type.includes('丹药') || item.type.includes('丹'))) {
                alert('该物品不是丹药');
                return;
            }

            if (item.count <= 0) {
                alert('丹药数量不足');
                return;
            }

            // 应用丹药效果
            if (item.effects) {
                let effectMessages = [];

                Object.entries(item.effects).forEach(([attr, value]) => {
                    if (attr === 'cultivationProgress') {
                        // 增加修炼进度
                        gameState.variables.cultivationProgress = (gameState.variables.cultivationProgress || 0) + value;
                        effectMessages.push(`修炼进度+${value}`);

                        // 检查是否达到突破条件
                        if (gameState.variables.cultivationProgress >= gameState.variables.cultivationProgressMax) {
                            effectMessages.push('已达到突破条件！请在剧情中选择突破选项');
                        }
                    } else if (attr === 'hp') {
                        // 恢复体力
                        gameState.variables.hp = Math.min(
                            (gameState.variables.hp || 0) + value,
                            gameState.variables.hpMax || 100
                        );
                        effectMessages.push(`体力+${value}`);
                    } else if (attr === 'mp') {
                        // 恢复法力
                        gameState.variables.mp = Math.min(
                            (gameState.variables.mp || 0) + value,
                            gameState.variables.mpMax || 100
                        );
                        effectMessages.push(`法力+${value}`);
                    } else if (attr === 'hpMax') {
                        // 增加体力上限
                        gameState.variables.hpMax = (gameState.variables.hpMax || 100) + value;
                        effectMessages.push(`体力上限+${value}`);
                    } else if (attr === 'mpMax') {
                        // 增加法力上限
                        gameState.variables.mpMax = (gameState.variables.mpMax || 100) + value;
                        effectMessages.push(`法力上限+${value}`);
                    } else if (gameState.variables.attributes && attr in gameState.variables.attributes) {
                        // 增加属性
                        gameState.variables.attributes[attr] = (gameState.variables.attributes[attr] || 0) + value;
                        effectMessages.push(`${getAttributeName(attr)}+${value}`);
                    }
                });

                // 减少丹药数量
                item.count--;
                if (item.count <= 0) {
                    gameState.variables.items.splice(itemIndex, 1);
                }

                // 🆕 记录服用丹药到缓存（累加数量）
                if (!gameState.pendingActions.pills[item.name]) {
                    gameState.pendingActions.pills[item.name] = 0;

        // 增加材料选择数量
        function increaseMaterial(materialName) {
            const material = gameState.variables.items.find(item => item.name === materialName);
            if (!material) return;

            const selectedCount = baiyiState.selectedMaterials[materialName] || 0;
            if (selectedCount < material.count) {
                baiyiState.selectedMaterials[materialName] = selectedCount + 1;
                updateBaiyiMaterialsList();
            }
        }

        // 减少材料选择数量
        function decreaseMaterial(materialName) {
            const selectedCount = baiyiState.selectedMaterials[materialName] || 0;
            if (selectedCount > 0) {
                baiyiState.selectedMaterials[materialName] = selectedCount - 1;
                if (baiyiState.selectedMaterials[materialName] === 0) {
                    delete baiyiState.selectedMaterials[materialName];
                }
                updateBaiyiMaterialsList();
            }
        }

        // 执行炼制操作（炼丹或炼器）
        async function performCrafting(craftingType) {
            const selectedNames = Object.keys(baiyiState.selectedMaterials);

            if (selectedNames.length === 0) {
                alert('请先选择材料！');
                return;
            }

            // 构建材料描述
            const materialsDesc = selectedNames.map(name => {
                const count = baiyiState.selectedMaterials[name];
                return `${count}个${name}`;
            }).join('和');

            // 构建炼制消息
            const craftingMessage = `开始${craftingType}，使用材料：${materialsDesc}`;

            // 扣除材料数量
            selectedNames.forEach(name => {
                const count = baiyiState.selectedMaterials[name];
                const material = gameState.variables.items.find(item => item.name === name);
                if (material) {
                    material.count -= count;
                    if (material.count <= 0) {
                        const index = gameState.variables.items.indexOf(material);
                        gameState.variables.items.splice(index, 1);
                    }
                }
            });

            // 清空选择的材料
            baiyiState.selectedMaterials = {};

            // 更新UI
            updateStatusPanel();

            // 保存游戏状态
            await saveGameHistory().catch(err => console.error('保存失败:', err));

            // 发送炼制消息给AI
            if (!gameState.isProcessing) {
                // 显示用户输入
                displayUserMessage(craftingMessage);

                // 添加到历史记录
                gameState.conversationHistory.push({
                    role: 'user',
                    content: craftingMessage
                });

                // 保存当前变量快照（用户消息）
                gameState.variableSnapshots.push(JSON.parse(JSON.stringify(gameState.variables)));

                gameState.isProcessing = true;

                try {
                    // 构建增强提示
                    const enhancedInput = buildEnhancedPrompt(craftingMessage);

                    // 调用AI
                    const response = await callAI(enhancedInput, false, craftingMessage);

                    // 处理AI响应
                    handleAIResponse(response);

                    // 触发动态世界生成（异步，不阻塞主流程）
                    generateDynamicWorld().catch(err => console.error('[动态世界] 生成异常:', err));

                } catch (error) {
                    console.error('[炼制] AI调用失败:', error);
                    displayErrorMessage('炼制失败，请重试');
                    gameState.isProcessing = false;
                }
            }
        }

        // 处理消息勾选（自动选中之后的所有消息）- 保留在game.html中
        function handleMessageCheck(messageDiv) {
            const checkbox = messageDiv.querySelector('.message-checkbox');
            const allMessages = Array.from(document.querySelectorAll('.message'));
            const currentIndex = allMessages.indexOf(messageDiv);

            if (checkbox.checked) {
                // 勾选当前消息，自动勾选之后的所有消息
                for (let i = currentIndex; i < allMessages.length; i++) {
                    const msg = allMessages[i];
                    const cb = msg.querySelector('.message-checkbox');
                    if (cb) {
                        cb.checked = true;
                        msg.classList.add('selected-for-delete');
                    }
                }
            } else {
                // 取消勾选当前消息，自动取消之前的所有消息
                for (let i = 0; i <= currentIndex; i++) {
                    const msg = allMessages[i];
                    const cb = msg.querySelector('.message-checkbox');
                    if (cb) {
                        cb.checked = false;
                        msg.classList.remove('selected-for-delete');
                    }
                }
            }
        }

        // 🎯 统一构建增强提示的函数
        function buildEnhancedPrompt(userMessage, options = {}) {
            // 获取配置
            const saved = localStorage.getItem('gameConfig');
            const config = saved ? JSON.parse(saved) : {};

            // 🆕 明确标识这是用户的要求
            let enhancedPrompt = `【后续情节】${userMessage}`;

            // 🆕 0. 根据人称设置添加提示
            const narrativePerspective = config.narrativePerspective || 'first';
            const perspectiveHints = {
                'first': '[使用第一人称"我"]',
                'second': '[使用第二人称"你"]',
                'third': '[使用第三人称"他/她"]'
            };
            if (perspectiveHints[narrativePerspective]) {
                enhancedPrompt += `\n\n${perspectiveHints[narrativePerspective]}`;
            }

            // 1. 根据机缘值和天谴值添加提示
            if (gameState.variables.karmaFortune >= 80) {
                enhancedPrompt += '\n\n';
            } else if (gameState.variables.karmaPunishment >= 80) {
                enhancedPrompt += '\n\n';
            }

            // 2. 获取最小字数要求
            const minWordCount = config.minWordCount || 0;

            // 3. 如果是选项模式，添加属性判定结果
            if (options.attributeCheck) {
                const { requirement, checkResult } = options.attributeCheck;
                if (requirement.hasRequirement) {
                    if (checkResult.met) {
                        enhancedPrompt += `\n\n[判定通过：${checkResult.attributeName}${checkResult.currentValue}${requirement.operator}${checkResult.requiredValue}→成功剧情]`;
                    } else {
                        enhancedPrompt += `\n\n[判定失败：${checkResult.attributeName}${checkResult.currentValue}不足${checkResult.requiredValue}→失败剧情]`;
                    }
                }
            }

            // 4. 强制要求更新变量和生成选项
            enhancedPrompt += '\n\n[必须返回4选项(含属性判定)，顺序：1.对话 2.离开 3.行动 4.R18]';

            // 5. 添加最小字数要求
            if (minWordCount > 0) {
                enhancedPrompt += `\n\n[story≥${minWordCount}字]`;
            }

            // 6. 性爱场景描写要求
            enhancedPrompt += '\n\n[禁止神化主角或者出现绝望剧情]';

            // 8. 人际关系提醒（v3.1格式）
            enhancedPrompt += '\n\n[NPC互动在variableUpdate中更新：relationships.NPC名字={favor:数值,opinion:"评价",history:["事件"]}。R18必更新：isVirgin/firstSex/lastSex/sexualPreference/appearance]';

            // 9. 变量更新说明（v3.1格式）
            enhancedPrompt += '\n\n[使用variableUpdate字段，格式：{"属性路径":值}。例：{"hp":100,"items.灵石":50,"relationships.柳如烟.favor":80}]';

            // 10. 历史记录要求
            enhancedPrompt += '\n\n[history返回1条≥40字。]';

            // 12. 炼丹炼器等级提示
            const alchemyLevel = gameState.variables.alchemyLevel || "未入门";
            const craftingLevel = gameState.variables.craftingLevel || "未入门";

            if (userMessage.includes('炼丹') || userMessage.includes('炼制') || userMessage.includes('丹药')) {
                if (alchemyLevel !== "未入门") {
                    enhancedPrompt += `\n\n[当前炼丹等级：${alchemyLevel}，根据等级判断成功率和丹药品质]`;
                } else {
                    enhancedPrompt += '\n\n[未学过炼丹，成功率极低或失败]';
                }
            }

            if (userMessage.includes('炼器') || userMessage.includes('炼制') || userMessage.includes('法宝')) {
                if (craftingLevel !== "未入门") {
                    enhancedPrompt += `\n\n[当前炼器等级：${craftingLevel}，根据等级判断成功率和法宝品质]`;
                } else {
                    enhancedPrompt += '\n\n[未学过炼器，成功率极低或失败]';
                }
            }

            // 13. 添加本地操作摘要（如果有的话）
            const hasLocalOps = gameState.localOps && (
                (gameState.localOps.items && gameState.localOps.items.length > 0) ||
                (gameState.localOps.attrs && gameState.localOps.attrs.length > 0) ||
                (gameState.localOps.equip && gameState.localOps.equip.length > 0)
            );
            
            if (hasLocalOps) {
                const localOpsSummary = {
                    items: gameState.localOps.items || [],
                    attrs: gameState.localOps.attrs || [],
                    equip: gameState.localOps.equip || []
                };
                enhancedPrompt += '\n\n[本地操作记录]' + JSON.stringify(localOpsSummary);
            }

            return enhancedPrompt;
        }

            if (!userText) {
                alert('请输入内容！');
                return;
            }

            }

            }

            inputBox.value = '';

            gameState.conversationHistory.push({
                role: 'user',
                content: userText
            });

            gameState.variableSnapshots.push(JSON.parse(JSON.stringify(gameState.variables)));

            clearPendingActions();

            saveGameHistory().catch(err => console.error('保存历史失败:', err));

            historyDiv.scrollTop = historyDiv.scrollHeight;

            try {

                const enhancedInput = buildEnhancedPrompt(userText);

                // 🆕 在控制台显示完整的增强提示
                console.log('🤖 [发送给AI的完整Prompt]', enhancedInput);

                // 🔧 传入原始用户输入（用于向量检索）
                const response = await callAI(enhancedInput, false, userText);

                // 移除加载提示
                const loading = document.getElementById('loading-message');
                if (loading) loading.remove();

                handleAIResponse(response);

                generateDynamicWorld().catch(err => console.error('[动态世界] 生成异常:', err));

                displayErrorMessageWithRetry('AI响应失败：' + error.message, async () => {

                    const errorDiv = document.getElementById('error-message-with-retry');
                    if (errorDiv) errorDiv.remove();
                    
                    // 重新生成最后的响应
                    await regenerateLastResponse();
                });
            }

            gameState.isProcessing = false;
        }
